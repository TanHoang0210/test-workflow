<div class="flow-container">
  <react-flow-builder
    #flowBuilder
    [showHeader]="true"
  ></react-flow-builder>
</div>

@if (saveResult(); as result) {
  <div class="save-toast" [ngClass]="'save-toast--' + result.type">{{ result.text }}</div>
}

<script type="module" src="/react-flow.js"></script>
<link rel="stylesheet" href="/react-flow-wrapper.css" />
