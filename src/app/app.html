<div class="flow-container">
  <react-flow-builder
    #flowBuilder
    [showHeader]="true"
    (onSave)="onSave()"
  ></react-flow-builder>
</div>

@if (execLogs().length > 0) {
  <div class="exec-panel">
    <div class="exec-panel__header">
      <span class="exec-panel__title">Execution Log</span>
      <button class="exec-panel__clear" (click)="clearLogs()">Xóa</button>
    </div>
    <div class="exec-panel__body">
      @for (entry of execLogs(); track $index) {
        <div class="exec-log-entry" [ngClass]="'exec-log-entry--' + entry.level">
          <span style="opacity:0.5">{{ entry.time }}</span>  {{ entry.text }}
        </div>
      }
    </div>
  </div>
}

<script type="module" src="/react-flow.js"></script>
<link rel="stylesheet" href="/react-flow-wrapper.css" />
